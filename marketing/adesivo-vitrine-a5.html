<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adesivo de vitrine — Clube Diana</title>
<style>
  @page { size: A5; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 148mm; height: 210mm;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #2b1d16; color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 14mm;
    border: 3mm solid #d4a017;
  }
  .bolinha {
    width: 34mm; height: 34mm; border-radius: 50%;
    border: 2mm solid #d4a017; color: #d4a017;
    display: flex; align-items: center; justify-content: center;
    font-size: 17mm; font-weight: 800; margin-bottom: 10mm;
  }
  .clube { font-size: 4.2mm; letter-spacing: .3em; color: #d4a017; font-weight: 700; }
  h1 { font-size: 17mm; line-height: 1.02; font-weight: 800; margin: 7mm 0 6mm; }
  h1 span { color: #d4a017; }
  p { font-size: 5.4mm; line-height: 1.35; color: #e9dcc7; max-width: 110mm; }
  .qr {
    width: 48mm; height: 48mm; margin-top: 9mm;
    background: #fff; border-radius: 3mm; padding: 2mm;
  }
  .url {
    margin-top: 7mm; font-size: 4.4mm; font-weight: 700; letter-spacing: .06em;
    color: #fff; border-top: 0.4mm solid #5a4636; padding-top: 6mm;
  }
</style>
</head>
<body>
  <div class="bolinha">D</div>
  <div class="clube">CASA DE CARNES DIANA</div>
  <h1>AQUI TEM<br><span>CLUBE DIANA</span></h1>
  <p>Pergunte no caixa: informando o CPF, o desconto do clube entra no seu cupom.</p>
  <img class="qr" src="qr-site.png" alt="QR code do Clube Diana">
  <div class="url">CLUBE-DIANA.ONRENDER.COM</div>
</body>
</html>
