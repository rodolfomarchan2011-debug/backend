<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @page { size: 1080px 1080px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #faf6ef; color: #2b1d16;
    display: flex; flex-direction: column; padding: 64px;
    border-top: 24px solid #2b1d16;
  }
  .clube { font-size: 26px; letter-spacing: .28em; color: #a4161a; font-weight: 700; }
  h1 { font-size: 132px; line-height: .96; font-weight: 800; margin: 34px 0 26px; letter-spacing: -.02em; }
  h1 span { color: #a4161a; }
  .sub { font-size: 40px; line-height: 1.28; color: #4a4038; max-width: 880px; }
  .selo {
    margin-top: auto; display: flex; align-items: center; gap: 22px;
  }
  .bolinha {
    width: 108px; height: 108px; border-radius: 50%;
    border: 8px solid #d4a017; color: #d4a017;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 800;
  }
  .marca strong { display: block; font-size: 38px; letter-spacing: .06em; }
  .marca small { display: block; font-size: 24px; color: #6b5d4e; letter-spacing: .06em; }
  .site { margin-left: auto; text-align: right; font-size: 24px; color: #6b5d4e; }
  .site b { display: block; font-size: 30px; color: #a4161a; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="clube">CLUBE DE VANTAGENS</div>
  <h1>SEU CPF<br>VALE <span>DESCONTO</span></h1>
  <p class="sub">
    Cadastro gratuito, sem mensalidade. Informe o CPF no caixa e o desconto
    entra direto no seu cupom.
  </p>
  <div class="selo">
    <div class="bolinha">D</div>
    <div class="marca">
      <strong>DIANA</strong>
      <small>CASA DE CARNES</small>
    </div>
    <div class="site">
      FAÇA PARTE EM
      <b>CLUBE-DIANA.ONRENDER.COM</b>
    </div>
  </div>
</body>
</html>
